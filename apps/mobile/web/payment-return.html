<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Elvane payment</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f7f8; color: #18181b; padding: 24px; }
    main { width: min(440px, 100%); background: #fff; border: 1px solid #e4e4e7; border-radius: 20px; padding: 32px; text-align: center; box-shadow: 0 16px 48px rgba(0,0,0,.08); }
    .mark { width: 52px; height: 52px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; background: #f0fdf4; font-size: 26px; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0; color: #52525b; line-height: 1.55; }
    button { margin-top: 22px; border: 0; border-radius: 12px; padding: 12px 18px; font: inherit; font-weight: 600; cursor: pointer; background: #18181b; color: #fff; }
    small { display: block; margin-top: 16px; color: #71717a; }
  </style>
</head>
<body>
  <main>
    <div class="mark" id="mark">✓</div>
    <h1 id="title">Payment received</h1>
    <p id="message">Your Elvane order is being confirmed in the original tab.</p>
    <button id="closeButton" type="button">Return to Elvane</button>
    <small id="hint">This payment tab can be closed safely.</small>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const status = params.get('payment');
      const orderNumber = params.get('orderNumber') || '';

      if (status === 'cancelled') {
        document.getElementById('mark').textContent = '×';
        document.getElementById('title').textContent = 'Payment not completed';
        document.getElementById('message').textContent =
          'No payment was confirmed. You can return to Elvane and try again.';
      }

      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(
            {
              type: 'elvane-payment-return',
              status,
              orderNumber,
            },
            window.location.origin,
          );
        }
      } catch (_) {
        // The original Elvane tab also polls/reconciles payment state.
      }

      const closeTab = () => {
        window.close();
        setTimeout(() => {
          document.getElementById('hint').textContent =
            'You can close this tab and return to the original Elvane tab.';
        }, 150);
      };

      document.getElementById('closeButton').addEventListener('click', closeTab);

      if (status === 'success') {
        setTimeout(closeTab, 1200);
      }
    })();
  </script>
</body>
</html>

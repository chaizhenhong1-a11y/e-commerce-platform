<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elvane payment</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7f8;color:#18181b;display:grid;min-height:100vh;place-items:center}.card{width:min(420px,calc(100% - 40px));background:#fff;border:1px solid #e4e4e7;border-radius:20px;padding:32px;text-align:center;box-shadow:0 16px 50px rgba(0,0,0,.08)}h1{font-size:24px;margin:8px 0}p{color:#71717a;line-height:1.55}.mark{font-size:34px}.small{font-size:13px}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" id="mark">✓</div>
    <h1 id="title">Payment received</h1>
    <p id="message">Elvane is confirming your payment. You can return to your order.</p>
    <p class="small">This tab will close automatically.</p>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const orderNumber = params.get("orderNumber") || "";
      const payment = params.get("payment") || "success";
      const success = payment === "success";

      if (!success) {
        document.getElementById("mark").textContent = "!";
        document.getElementById("title").textContent = "Payment not completed";
        document.getElementById("message").textContent = "Return to your order to try payment again.";
      }

      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(
          { type: "elvane:payment-return", orderNumber, payment },
          location.origin,
        );
      }

      window.setTimeout(() => window.close(), success ? 900 : 1800);
    })();
  </script>
</body>
</html>
